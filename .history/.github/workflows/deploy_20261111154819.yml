name: Build and deploy to Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you run it manually too

permissions:
  id-token: write             # needed for OIDC login
  contents: read

env:
  ACR: <your registry name>
  RG: flask-learn-rg
  APP: flask-learn-app
  IMAGE: flask-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name $ACR
          docker build -t $ACR.azurecr.io/$IMAGE:${{ github.sha }} .
          docker push $ACR.azurecr.io/$IMAGE:${{ github.sha }}

      - name: Point the container app at the new image
        run: |
          az containerapp update -g $RG --name $APP \
            --image $ACR.azurecr.io/$IMAGE:${{ github.sha }}